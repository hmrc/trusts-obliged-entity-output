        \ to process the data further for the reason given by the code and text.\n\
        \ \n```\n[errorId | text]\n\n001   FAIL – NO MATCH\n002   FAIL – ALREADY REGISTERED\n\
        004   Duplicate submission acknowledgment reference\n999\t  Technical System\
        \ Error\n\n\n\n\n\n\n\n"
      headers:
        correlationid:
          $ref: "#/components/headers/correlationid"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/422ValidationErrorsRegistration"
          examples:
            "422ValidationErrorsRegistration":
              $ref: "#/components/examples/422ValidationErrorsRegistration"
    "422ValidationErrorsVariation":
      description: "Validation errors.\n \nErrors of this kind indicate that data\
        \ was successfully received without any technical issues, however it is unable\
        \ to process the data further for the reason given by the code and text.\n\
        \ \n```\n[errorId | text]\n\n003   Request could not be processed\n004   Duplicate\
        \ submission acknowledgment reference\n999\t  Technical System Error\n\n\n\
        \n\n\n\n\n"
      headers:
        correlationid:
          $ref: "#/components/headers/correlationid"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/422ValidationErrorsVariation"
          examples:
            "422ValidationErrorsVariation":
              $ref: "#/components/examples/422ValidationErrorsVariation"
  schemas:
    "422ValidationErrorsDisplay":
      type: "object"
      properties:
        error:
          description: "ETMP Business Validation Error Response"
          type: "object"
          properties:
