          $ref: "#/components/headers/correlationid"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DisplayResgistrationSuccessResponse"
          examples:
            Display Resgistration Success Response:
              $ref: "#/components/examples/DisplayRegistrationSuccessResponse"
    "200ObligedEntitiesSuccessResponse":
      description: "Display Trust or Estate Details"
      headers:
        correlationid:
          $ref: "#/components/headers/correlationid"
      content:
        application/json:
