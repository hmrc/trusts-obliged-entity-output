paths:
  /RESTAdapter/trustsandestates/registration:
    post:
      deprecated: false
      summary: "Register Trust or Estate"
      description: "This API allows a new trust or estate to be registered with HMRC\
        \ for tax purposes. \n\nThe call is synchronous.\n\nFor the successful scenario\
        \ the API confirms the registration and returns a unique Trust Registration\
        \ Number \n\nFor the unsuccessful scenario, the API will return error messages.\n\
        \nEPID Reference:\n\nEPID1756"
      operationId: "postRegistration"
      tags:
        - "trustsandestates"
      parameters:
        - $ref: "#/components/parameters/correlationid"
        - $ref: "#/components/parameters/X-Originating-System"
        - $ref: "#/components/parameters/X-Receipt-Date"
        - $ref: "#/components/parameters/X-Transmitting-System"
      requestBody:
        $ref: "#/components/requestBodies/RegistrationRequest"
      responses:
        "201":
          $ref: "#/components/responses/201RegistrationSuccessResponse"
        "400":
          description: "Bad Request\n"
          headers:
            correlationid:
              $ref: "#/components/headers/correlationid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseSystemErrorType"
              examples:
                Bad Request:
                  value:
                    error:
                      code: "400"
                      message: "String"
                      logID: "00000000000000000000000000000000"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
        "422":
          $ref: "#/components/responses/422ValidationErrorsRegistration"
        "500":
          description: "Internal Server Error"
          headers:
            correlationid:
              $ref: "#/components/headers/correlationid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseSystemErrorType"
              examples:
                Internal Server Error:
                  value:
                    error:
                      code: "500"
                      message: "String"
                      logID: "00000000000000000000000000000000"
    put:
      deprecated: false
      summary: "Vary Trust or Estate "
      description: "This API allows to notify HMRC of changes to a registered trust\
        \ or estate, such as the appointment of new trustees, the addition of beneficiaries,\
        \ or the conclusion of an estate's administration period. \n\nThe call is\
        \ synchronous.\n\nFor the successful scenario the API acknowledges the variation\
        \ with a form bundle reference number.\n\nFor the unsuccessful scenario, the\
        \ API will return error messages.\n\nEPID Reference:\n\nEPID1757"
