    ObligedEntitiesSuccessResponse:
      description: "Comment describing your JSON Schema"
      type: "object"
      properties:
        success:
          type: "object"
          properties:
            submissionDate:
              $ref: "#/components/schemas/dateString1"
            trustName:
              $ref: "#/components/schemas/orgName56String1"
            identifiers:
              description: "Possible options - UTR to be returned for Taxable , URN\
                \ for Non- Taxable , UTR and URN if Trust has converted from Non-taxable\
                \ to Taxable"
              type: "object"
              properties:
                utr:
                  $ref: "#/components/schemas/utrString1"
                urn:
                  $ref: "#/components/schemas/urnString1"
              additionalProperties: false
            trustStartDate:
              $ref: "#/components/schemas/dateString1"
            correspondence:
              type: "object"
              properties:
                address:
                  $ref: "#/components/schemas/addressType1"
                welsh:
                  description: "Welsh Language Preference"
                  type: "boolean"
                braille:
                  description: "Braille Preference"
                  type: "boolean"
              required:
                - "address"
              additionalProperties: false
            entities:
              type: "object"
              properties:
                leadTrustee:
                  type: "object"
                  properties:
                    leadTrusteeIndividual:
                      type: "object"
                      properties:
                        firstName:
                          $ref: "#/components/schemas/nameString1"
                        middleName:
                          $ref: "#/components/schemas/nameString1"
                        lastName:
                          $ref: "#/components/schemas/nameString1"
                        dateofBirth:
                          $ref: "#/components/schemas/dateString1"
                        nationality:
                          $ref: "#/components/schemas/countryType2"
                        countryofResidence:
                          $ref: "#/components/schemas/countryType2"
                      required:
                        - "firstName"
                        - "lastName"
                        - "dateofBirth"
                    leadTrusteeCompany:
                      type: "object"
                      properties:
                        orgName:
                          type: "string"
                          pattern: "^[A-Za-z0-9 ,.()/&'-]{1,56}$"
                        countryOfResidence:
                          $ref: "#/components/schemas/countryType2"
                      required:
                        - "orgName"
                  additionalProperties: false
                trustees:
                  type: "array"
                  minItems: 1
                  maxItems: 25
                  items:
                    type: "object"
                    properties:
                      trusteeIndividual:
                        $ref: "#/components/schemas/individualType"
                      trusteeCompany:
                        $ref: "#/components/schemas/companyType2"
                    additionalProperties: false
                naturalPerson:
                  type: "array"
                  minItems: 1
                  maxItems: 25
                  items:
                    $ref: "#/components/schemas/individualType"
                settlors:
                  description: "Atleast one Settlor will be present"
                  type: "object"
                  minProperties: 1
                  properties:
                    settlorIndividual:
                      type: "array"
                      minItems: 1
                      maxItems: 25
                      items:
                        $ref: "#/components/schemas/individualType"
                    settlorCompany:
                      type: "array"
                      minItems: 1
                      maxItems: 25
                      items:
                        $ref: "#/components/schemas/companyType2"
                    deceased:
                      $ref: "#/components/schemas/individualType"
                protectors:
                  type: "object"
                  properties:
                    protectorIndividual:
                      type: "array"
                      minItems: 1
                      maxItems: 25
                      items:
                        $ref: "#/components/schemas/individualType"
                    protectorCompany:
                      type: "array"
                      minItems: 1
                      maxItems: 25
                      items:
                        $ref: "#/components/schemas/companyType2"
                  additionalProperties: false
                beneficiary:
                  type: "object"
                  minProperties: 1
                  properties:
                    individual:
                      type: "array"
                      minItems: 1
                      maxItems: 25
                      items:
                        $ref: "#/components/schemas/individualType"
                    company:
                      type: "array"
                      minItems: 1
                      maxItems: 25
                      items:
                        $ref: "#/components/schemas/companyType2"
                    trust:
                      type: "array"
                      minItems: 1
                      maxItems: 25
                      items:
                        $ref: "#/components/schemas/companyType2"
                    charity:
                      type: "array"
                      minItems: 1
                      maxItems: 25
                      items:
                        $ref: "#/components/schemas/companyType2"
                    unidentified:
                      type: "array"
                      minItems: 1
                      maxItems: 25
                      items:
                        type: "object"
                        properties:
                          beneficiaryDescription:
                            $ref: "#/components/schemas/descriptionType"
                        additionalProperties: false
                    large:
                      type: "array"
                      minItems: 1
                      maxItems: 25
                      items:
                        type: "object"
                        properties:
                          beneficiaryDescription:
                            $ref: "#/components/schemas/descriptionType"
                          beneficiaryDescription1:
                            $ref: "#/components/schemas/descriptionType"
                          beneficiaryDescription2:
                            $ref: "#/components/schemas/descriptionType"
                          beneficiaryDescription3:
                            $ref: "#/components/schemas/descriptionType"
                          beneficiaryDescription4:
                            $ref: "#/components/schemas/descriptionType"
                          companyDetails:
                            $ref: "#/components/schemas/companyType2"
                        additionalProperties: false
                    other:
                      type: "array"
                      minItems: 1
                      maxItems: 25
                      items:
                        type: "object"
                        properties:
                          otherBeneficiaryDescription:
                            $ref: "#/components/schemas/descriptionType"
                          countryofResidence:
                            $ref: "#/components/schemas/countryType2"
              required:
                - "leadTrustee"
          required:
            - "trustName"
            - "identifiers"
            - "trustStartDate"
            - "correspondence"
          additionalProperties: false
      required:
        - "success"
      additionalProperties: false
