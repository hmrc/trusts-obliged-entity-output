openapi: "3.0.1"
info:
  title: "Trusts and Estates Registration Services (TRS)"
  description: "\nThis API specification describes the data structures and operations\
    \ to support the Trusts and Estates Registration Services (TRS)\n\nThe following\
    \ resources are offered by this API:\n\n- **Match Existing Trust or Estate**\n\
    \   \n\tAllows authorised HMRC systems to check whether a trust or estate is already\
    \ recorded in HMRC  central regis ter before initiating a new registration or authorisation.\n\
    \n- **Registration of Trust or Estate** \n\n     Allows a new trust or estate\
    \ to be registered with HMRC for tax purposes. \n\n- **Trust or Estate Variation**\n\
    \n\tAllows to notify HMRC of changes to a registered trust or estate, such as\
    \ the appointment of new trustees, the addition of beneficiaries, or the conclusion\
    \ of an estate's administration period. \n\n- **Retrieve Trust or Estate Registration**\n\
    \n     Allows authorised services to retrieve the full registration record for\
    \ a trust or estate held in HMRC central back-office system. \n\n- **Agent Known\
    \ Fact Check**\n\n     Supports the authorisation journey for tax agents acting\
    \ on behalf of a trust or estate.\n\n- **Display Trust or Estate Details**\n\n\
    \     Allows authorised services to retrieve a comprehensive view of a registered\
    \ trusts obliged entities.\n\n**EPID references:**\n \n- EPID1755  -HIP OAS: Trusts\
    \ and Estates Registration Services (TRS)\n\n```\n```\n  **Change Log:**\n  |\
    \ Version | Date | Author | Description |\n  |---|-----|------|-----|\n  |0.1.0\
    \ | 2026-06-02| Hima V Pramod | Initial draft| \n|0.1.1 | 2026-06-15 | Hima V\
    \ Pramod|  Below changes made aligning to review comments:\n||||422 Validation\
    \ errors fieldname changed from **errors** to **error**.|\n||||422 Validation\
    \ errors fieldname changed from **code** to **errorId**.|\n||||Corrected description\
    \ and examples for 500 Internal Server Error.|\n||||Request bodies are made mandatory\
    \ for POST/PUT operations.|\n|0.1.2 | 2026-06-17 | Rajasekhar Y| Initial draft|\n\
    ||||Added 3 GET API path with Response bodies.\n||||The leadTruseeOrg field **name**\
    \ has been renamed to **orgName** for Registration, Variation, Display and Retrieve\
    \ APIs  as this is creating ambiguity in the XSD. \n|0.1.3 | 2026-06-25|Hima V Pramod| As the\
    \ same definition names were being used in both Registration and Variation API,\
    \ this resulted in inconsistencies in the structures across the two APIs.This\
    \ has now been fixed to align with the correct structure without any change to the payload.|\n||||Validations are added for **idType** and **idValue**.|\n||||Error texts are corrected for Registration and Match APIs.|"
  version: "0.1.3"
  license:
    name: "Apache 2.0"
    url: "http://www.apache.org/licenses/LICENSE-2.0"
  x-integration-catalogue:
    reviewed-date: "2026-06-02T16:26:00Z"
    platform: "HIP"
    publisher-reference: "Trusts and Estates Registration Services (TRS)"
    short-description: "Trusts and Estates Registration Services (TRS)"
    status: "BETA"
    api-type: "SIMPLE"
