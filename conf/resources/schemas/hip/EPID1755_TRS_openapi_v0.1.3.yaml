        $ref: "#/components/requestBodies/VariationRequest"
      responses:
        "200":
          $ref: "#/components/responses/200VariationSuccessResponse"
        "400":
          description: "Bad Request"
          headers:
            correlationid:
              $ref: "#/components/headers/correlationid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseSystemErrorType"
              examples:
                Bad Request:
                  value:
                    error:
                      code: "400"
                      message: "String"
                      logID: "00000000000000000000000000000000"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
        "422":
