    DisplayResgistrationSuccessResponse:
      description: "Comment describing your JSON Schema"
      type: "object"
      properties:
        success:
          type: "object"
          properties:
            responseHeader:
              type: "object"
              properties:
                dfmcaReturnUserStatus:
                  type: "string"
                  enum:
                    - "Processed"
                    - "In Processing"
                    - "Pending Closure"
                    - "Closed"
                    - "Suspended"
                    - "Parked"
                    - "Obsoleted "
                formBundleNo:
                  type: "string"
                  pattern: "^[0-9]{12}$"
              required:
                - "dfmcaReturnUserStatus"
                - "formBundleNo"
              additionalProperties: false
            trustOrEstateDisplay:
              type: "object"
              properties:
                applicationType:
                  description: "01-Trust,02-Estate"
                  type: "string"
                  enum:
                    - "01"
                    - "02"
                matchData:
                  description: "Possible options - UTR to be returned for Taxable\
                    \ , URN for Non- Taxable , UTR and URN if Trust has converted\
                    \ from Non-taxable to Taxable"
                  type: "object"
                  properties:
                    utr:
                      $ref: "#/components/schemas/utrString1"
                    urn:
                      $ref: "#/components/schemas/urnString1"
                  additionalProperties: false
                correspondence:
                  type: "object"
                  properties:
                    abroadIndicator:
                      type: "boolean"
                    name:
                      $ref: "#/components/schemas/corNameType1"
                    address:
                      $ref: "#/components/schemas/addressType1"
                    phoneNumber:
                      $ref: "#/components/schemas/phoneString1"
                    welsh:
                      $ref: "#/components/schemas/checkElement1"
                    braille:
                      $ref: "#/components/schemas/checkElement1"
                  required:
                    - "abroadIndicator"
                    - "name"
                    - "address"
                    - "phoneNumber"
                  additionalProperties: false
                declaration:
                  type: "object"
                  properties:
                    name:
                      $ref: "#/components/schemas/nameType1"
                    address:
                      $ref: "#/components/schemas/addressType1"
                  required:
                    - "name"
                    - "address"
                  additionalProperties: false
                details:
                  type: "object"
                  properties:
                    trust:
                      type: "object"
                      properties:
                        details:
                          $ref: "#/components/schemas/trustDetailsType1"
                        entities:
                          $ref: "#/components/schemas/trustEntitiesType1"
                        assets:
                          $ref: "#/components/schemas/assetsType1"
                      required:
                        - "details"
                        - "entities"
                      additionalProperties: false
                    estate:
                      type: "object"
                      properties:
                        entities:
                          $ref: "#/components/schemas/entitiesType1"
                        administrationEndDate:
                          $ref: "#/components/schemas/dateString1"
                        periodTaxDues:
                          description: "01-Total Income Tax and Capital Gains due\
                            \ for the administration period more than £10,000, \r\n\
                            02-Date of Death before 05 April 2016 and the sale of\
                            \ estates assets by administrators is £225,000 in any\
                            \ one tax year, \r\n03-Date of Death After 05 April 2016\
                            \ and the sale of estates assets by administrators is\
                            \ £250.00 in any one tax year, \r\n04-Estate worth more\
                            \ than 2.5 million at the death of death"
                          type: "string"
                          enum:
                            - ""
                            - "01"
                            - "02"
                            - "03"
                            - "04"
                      required:
                        - "entities"
                        - "periodTaxDues"
                      additionalProperties: false
                  additionalProperties: false
                submissionDate:
                  $ref: "#/components/schemas/dateString1"
              required:
                - "applicationType"
                - "matchData"
                - "correspondence"
                - "declaration"
                - "details"
              additionalProperties: false
          required:
            - "responseHeader"
          additionalProperties: false
      required:
        - "success"
      additionalProperties: false
    entitiesType:
      type: "object"
      properties:
        deceased:
          $ref: "#/components/schemas/willTypeEstate"
        personalRepresentative:
          type: "object"
          oneOf:
            - $ref: "#/components/schemas/estatePerRepInd"
            - $ref: "#/components/schemas/estatePerRepOrg"
      required:
        - "deceased"
        - "personalRepresentative"
      additionalProperties: false
