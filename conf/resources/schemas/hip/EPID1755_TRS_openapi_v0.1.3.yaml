components:
  headers:
    correlationid:
      description: "Unique alphanumeric number used for correlation purposes, generated\
        \ by the originating system and conforming to 36-character UUID (formatted)."
      style: "simple"
      required: true
      deprecated: false
      schema:
        type: "string"
        pattern: "^[0-9a-fA-F]{8}[-][0-9a-fA-F]{4}[-][0-9a-fA-F]{4}[-][0-9a-fA-F]{4}[-][0-9a-fA-F]{12}$"
  parameters:
    correlationid:
      name: "correlationid"
      in: "header"
      description: "Unique alphanumeric number used for correlation purposes, generated\
        \ by the originating system and conforming to 36-character UUID (formatted)."
      required: true
      deprecated: false
      allowEmptyValue: false
      style: "simple"
      schema:
        pattern: "^[0-9a-fA-F]{8}[-][0-9a-fA-F]{4}[-][0-9a-fA-F]{4}[-][0-9a-fA-F]{4}[-][0-9a-fA-F]{12}$"
        type: "string"
        example: "f0bd1f32-de51-45cc-9b18-0520d6e3ab1a"
    idType:
      name: "idType"
      in: "path"
      description: "Required - Possible values for idType: UTR or URN"
      required: true
      deprecated: false
      allowEmptyValue: false
      style: "simple"
      schema:
        type: "string"
        pattern: "^[A-Z0-9]{3,6}$"
      example: "URN"
    idValue:
      name: "idValue"
      in: "path"
      description: "Required - Value of UTR or URN"
      required: true
      deprecated: false
      allowEmptyValue: false
      style: "simple"
      schema:
        type: "string"
        pattern: "^[A-Z0-9]{1,15}$"
      example: "XATRUST80000001"
    X-Originating-System:
      name: "X-Originating-System"
      in: "header"
      description: "System that is the originator of the message. Used to distinctly\
        \ identifies the service.Eg:TRS"
      required: true
      deprecated: false
      allowEmptyValue: false
      style: "simple"
      schema:
        enum:
          - "TRS"
        type: "string"
    X-Receipt-Date:
      name: "X-Receipt-Date"
      in: "header"
      description: "The time the message was created by the system sending the message.\
        \ The value should follow this date-time pattern, and be represented in the\
        \ UTC time zone: yyyy-MM-ddTHH:mm:ssZ"
      required: true
      deprecated: false
      allowEmptyValue: false
      style: "simple"
      schema:
        format: "date-time"
        type: "string"
      example: "2025-01-30T23:59:59Z"
    X-Transmitting-System:
      name: "X-Transmitting-System"
      in: "header"
      description: "Intermediary system that performs the transmission of the message."
      required: true
      deprecated: false
      allowEmptyValue: false
      style: "simple"
      schema:
        enum:
          - "HIP"
        type: "string"
  requestBodies:
    MatchRequest:
      description: ""
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MatchRequest"
          examples:
            MatchRequest:
              $ref: "#/components/examples/MatchRequest"
    RegistrationRequest:
      description: ""
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RegistrationRequest"
          examples:
            RegistrationRequest:
              $ref: "#/components/examples/RegistrationRequest"
    VariationRequest:
      description: ""
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VariationRequest"
          examples:
            VariationRequest:
              $ref: "#/components/examples/VariationRequest"
  responses:
    "200AgentSuccessResponse":
      description: "AgentSuccessResponse"
      headers:
        correlationid:
          $ref: "#/components/headers/correlationid"
      content:
        application/json:
          schema:
